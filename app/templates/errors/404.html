{% extends "base.html" %}

{% block title %}Page Not Found (404) - AI Group Project Team Builder{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h4 class="fw-bold mb-2">Page Not Found</h4>
        <p class="text-muted small mb-4">The academic resource, project, or student profile you requested does not exist or may have been moved.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
