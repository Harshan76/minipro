{% extends "base.html" %}

{% block title %}Server Error (500) - AI Group Project Team Builder{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h4 class="fw-bold mb-2">Internal Server Error</h4>
        <p class="text-muted small mb-4">An unexpected server error occurred while processing your request. Please check the application logs.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
